server:
  port: 8080
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - path=/api/auth/**

            - id: post-service-route
              uri: lb://post-service
              predicates:
                - path=/api/posts/**
eureka:
  client:
    service-url:
      defaultZone: http://Discovery-server:8761/eureka


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
