server:
  port: 8081
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://mysql:3306/userdb
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  config:
    import: optional:configserver:http://config-server:8888

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
